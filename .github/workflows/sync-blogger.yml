name: Sinkron Blogger

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Jalankan sinkron
        env:
          # Domain diambil dari site.config.json (sumber kebenaran tunggal).
          # SITE_URL hanya untuk override sementara bila perlu uji coba.
          SITE_URL: ${{ vars.SITE_URL }}
          DEFAULT_IMAGE: ${{ vars.DEFAULT_IMAGE }}
        run: node scripts/sync-blogger.mjs
      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sinkron Blogger"
          git push
