<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Pelajaran - MAN 2 Grobogan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    :root {
        --primary: #673DE6;
        --accent: #0DB5A4;
        --accent-light: #5CE1E6;
        --bg-dark: #1A103D;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background: var(--bg-dark); color: #fff; }
    header { background: rgba(10,5,25,0.9); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #fff; text-decoration: none; }
    .logo img { height: 40px; }
    nav ul { display: flex; list-style: none; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; }
    .jadwal-wrap { padding: 120px 20px 80px; min-height: 80vh; max-width: 1000px; margin: auto; }
    .article-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; backdrop-filter: blur(10px); }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .filter-group { display: flex; flex-direction: column; }
    label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
    select { padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; outline: none; }
    select option { background: #1A103D; color: #fff; }
    .count { text-align: right; font-size: 13px; color: var(--accent-light); margin-bottom: 15px; font-weight: 600; }
    .jadwal-list { display: flex; flex-direction: column; gap: 12px; }
    .kartu { background: rgba(255, 255, 255, 0.95); border-radius: 18px; padding: 16px 20px; color: #1A103D; border-left: 6px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .k-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .k-time { font-weight: 700; font-size: 14px; color: var(--primary); }
    .k-kelas { background: var(--accent); color: #fff; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; }
    .k-guru { font-size: 16px; font-weight: 800; }
    .k-mapel { font-size: 13px; color: #555; display: flex; justify-content: space-between; margin-top: 4px; }
    .k-kode { background: #f0f0f0; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>

<header>
    <a href="/beranda/" class="logo"><i class="fa-solid fa-graduation-cap" style="color:var(--accent)"></i> MAN 2 GROBOGAN</a>
    <nav>
        <ul>
            <li><a href="/beranda/">Beranda</a></li>
            <li><a href="/beranda/jadwal/" style="color:var(--accent);font-weight:700">Jadwal Pelajaran</a></li>
        </ul>
    </nav>
</header>

<section class="jadwal-wrap">
    <div class="article-box">
        <h2 style="text-align:center; margin-bottom:25px">Cari Jadwal Pelajaran</h2>
        
        <div class="filters">
            <div class="filter-group"><label>Hari</label><select id="fHari"><option value="">Semua Hari</option></select></div>
            <div class="filter-group"><label>Kelas</label><select id="fKelas"><option value="">Semua Kelas</option></select></div>
            <div class="filter-group"><label>Nama Guru</label><select id="fGuru"><option value="">Semua Guru</option></select></div>
            <div class="filter-group"><label>Mata Pelajaran</label><select id="fMapel"><option value="">Semua Mapel</option></select></div>
        </div>

        <div class="count" id="count">Memuat data...</div>
        <div id="hasil" class="jadwal-list"></div>
    </div>
</section>

<script>
    fetch("data.json").then(r => r.json()).then(DATA => {
        const $ = id => document.getElementById(id);
        const urut = {"Senin":0,"Selasa":1,"Rabu":2,"Kamis":3,"Jumat":4,"Sabtu":5};

        function isi(id, field) {
            const unik = [...new Set(DATA.slots.map(s => s[field]))].sort((a,b) => 
                field === 'hari' ? urut[a]-urut[b] : a.localeCompare(b)
            );
            const sel = $(id);
            unik.forEach(v => {
                const o = document.createElement("option");
                o.value = v; o.textContent = v;
                sel.appendChild(o);
            });
        }

        isi("fHari", "hari"); isi("fKelas", "kelas"); isi("fGuru", "guru"); isi("fMapel", "mapel");

        function render() {
            const h = $("fHari").value, k = $("fKelas").value, g = $("fGuru").value, m = $("fMapel").value;
            const res = DATA.slots.filter(s => 
                (!h || s.hari === h) && (!k || s.kelas === k) && (!g || s.guru === g) && (!m || s.mapel === m)
            );
            
            $("count").textContent = `${res.length} Jadwal ditemukan`;
            $("hasil").innerHTML = res.map(s => `
                <div class="kartu">
                    <div class="k-head">
                        <span class="k-time">${s.hari}, ${s.mulai} - ${s.selesai} WIB</span>
                        <span class="k-kelas">Kelas ${s.kelas}</span>
                    </div>
                    <div class="k-guru">${s.guru}</div>
                    <div class="k-mapel">
                        <span>${s.mapel}</span>
                        <span class="k-kode">${s.cell}</span>
                    </div>
                </div>
            `).join("");
        }

        ["fHari","fKelas","fGuru","fMapel"].forEach(id => $(id).addEventListener("change", render));
        render();
    });
</script>
</body>
</html>
